# Publish this repository to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Live at: https://theotaoliu.github.io/wipe-line-page/
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on through the API if it is off, or configure-pages fails with
      # "Get Pages site failed" on a repository whose Pages source was never set to Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
